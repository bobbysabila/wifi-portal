<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Capital Mining WiFi – Sign in</title>
<style>
:root{
  --ink:#16140d; --yellow:#ffe600; --red:#d9291c; --paper:#ffffff;
  --muted:#6b6757; --line:#e4e0d2; --field:#f8f6ee; --bg:#14130f;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{
  min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px;
  background:
    repeating-linear-gradient(-45deg,rgba(255,230,0,.05) 0 14px,transparent 14px 28px),
    var(--bg);
  color:var(--ink);
}
.card{
  width:100%;max-width:380px;min-height:600px;background:var(--paper);border-radius:20px;
  overflow:hidden;display:flex;flex-direction:column;
  box-shadow:0 24px 60px rgba(0,0,0,.55);
}
.body{padding:32px 28px 28px;display:flex;flex-direction:column;flex:1}
.logo{width:88px;height:88px;display:block;margin:0 auto 16px}
h1{font-size:1.4rem;line-height:1.25;text-align:center;font-weight:700}
.sub{text-align:center;color:var(--muted);font-size:.95rem;margin:6px 0 26px}
form{display:flex;flex-direction:column;gap:16px}
label{display:block;font-size:.88rem;font-weight:600;margin-bottom:6px}
.field{position:relative}
.field svg{position:absolute;left:14px;top:50%;width:18px;height:18px;transform:translateY(-50%);stroke:var(--muted);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
input[type=text],input[type=password]{
  width:100%;height:50px;padding:0 46px 0 44px;font:inherit;font-size:1rem;color:var(--ink);
  background:var(--field);border:1.5px solid var(--line);border-radius:12px;
  transition:border-color .15s,box-shadow .15s,background .15s;
}
input:focus{outline:none;background:#fff;border-color:var(--ink);box-shadow:0 0 0 4px rgba(255,230,0,.55)}
.field.bad input{border-color:var(--red);background:#fff6f5}
.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:40px;height:40px;border:0;background:none;border-radius:10px;cursor:pointer;display:grid;place-items:center}
.eye svg{position:static;transform:none;stroke:var(--muted)}
.eye:hover svg{stroke:var(--ink)}
.eye:focus-visible,button.go:focus-visible,a:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.err{min-height:1.2em;color:var(--red);font-size:.85rem;font-weight:600;margin-top:-6px}
button.go{
  height:52px;border:0;border-radius:12px;background:var(--yellow);color:var(--ink);
  font:inherit;font-size:1.05rem;font-weight:700;cursor:pointer;
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.18);transition:transform .1s,filter .15s;
  display:flex;align-items:center;justify-content:center;gap:10px;
}
button.go:hover{filter:brightness(.96)}
button.go:active{transform:translateY(1px)}
button.go[disabled]{cursor:progress;filter:grayscale(.2) brightness(.95)}
.spin{width:18px;height:18px;border:3px solid rgba(0,0,0,.25);border-top-color:var(--ink);border-radius:50%;animation:r .7s linear infinite;display:none}
.loading .spin{display:block}
@keyframes r{to{transform:rotate(360deg)}}
.foot{margin-top:auto;padding-top:24px;text-align:center;font-size:.8rem;color:var(--muted);line-height:1.5}
.foot a{color:var(--ink);font-weight:600}
.ok{display:none;text-align:center;margin:auto 0}
.ok .tick{width:64px;height:64px;border-radius:50%;background:var(--yellow);display:grid;place-items:center;margin:0 auto 14px}
.ok .tick svg{width:32px;height:32px;stroke:var(--ink);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.ok h2{font-size:1.25rem}.ok p{color:var(--muted);margin-top:6px}
.done form,.done .sub,.done .foot{display:none}.done .ok{display:block}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation-duration:2s!important}}
@media (max-width:420px){body{padding:12px}.card{min-height:calc(100vh - 24px)}}
</style>
</head>

    <h1>Welcome to Capital Mining WiFi</h1>
    <p class="sub">Sign in to get online.</p>

    <form id="f" novalidate>
      <div>
        <label for="u">Username</label>
        <div class="field" id="fu">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
          <input id="u" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="Your staff username">
        </div>
      </div>
      <div>
        <label for="p">Password</label>
        <div class="field" id="fp">
          <svg viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
          <input id="p" name="password" type="password" autocomplete="current-password" placeholder="Your password">
          <button class="eye" type="button" id="eye" aria-label="Show password" aria-pressed="false">
            <svg viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
      <p class="err" id="err" role="alert" aria-live="polite"></p>
      <button class="go" type="submit" id="go"><span class="spin" aria-hidden="true"></span><span id="gt">Sign in</span></button>
    </form>

    <div class="ok" id="ok" role="status">
      <div class="tick"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
      <h2>You’re connected</h2>
      <p>You can now browse the internet.</p>
    </div>

    <p class="foot">By signing in you agree to the company WiFi usage policy.<br>Need access? Contact the <a href="#">IT helpdesk</a>.</p>
  </div>
</main>

<script>
// Demo behaviour. To use on a real gateway, replace the fake delay below
// with a POST to your hotspot login URL (e.g. MikroTik /login, UniFi, pfSense).
var $=function(i){return document.getElementById(i)};
var f=$('f'),u=$('u'),p=$('p'),err=$('err'),go=$('go'),card=$('card');
$('eye').addEventListener('click',function(){
  var show=p.type==='password';
  p.type=show?'text':'password';
  this.setAttribute('aria-pressed',show);
  this.setAttribute('aria-label',show?'Hide password':'Show password');
});
function bad(el,msg){$(el).classList.add('bad');err.textContent=msg}
[u,p].forEach(function(i){i.addEventListener('input',function(){
  $('fu').classList.remove('bad');$('fp').classList.remove('bad');err.textContent='';
})});
f.addEventListener('submit',function(e){
  e.preventDefault();
  if(!u.value.trim()){bad('fu','Enter your username.');u.focus();return}
  if(!p.value){bad('fp','Enter your password.');p.focus();return}
  go.disabled=true;go.classList.add('loading');$('gt').textContent='Signing in…';
  setTimeout(function(){card.classList.add('done')},1200);
});
</script>
